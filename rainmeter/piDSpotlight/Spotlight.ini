; πD Spotlight v3 — compact card, self-centering, reliable InputText
[Rainmeter]
Update=100
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!Hide][!Draggable 1][!CommandMeasure MeasureCenter "Update"]

[Metadata]
Name=πD Spotlight
Version=3.1.0

[Variables]
Font=Cascadia Mono
Pane=8,8,11,255
Line=28,28,38,255
Ink=230,230,239,255
Muted=139,139,154,255
Faint=62,62,76,255
Field=12,12,16,255
W=460
H=84
ScriptDesk=#CURRENTPATH#desk-grok.ps1

; center on primary work area whenever updated
[MeasureCenter]
Measure=Calc
Formula=1
OnUpdateAction=[!Move "(#SCREENAREAWIDTH#/2-#W#/2)" "(#SCREENAREAHEIGHT#/2-#H#/2)"]
UpdateDivider=-1
DynamicVariables=1

[MeasureAccent]
Measure=Script
ScriptFile=color-spot.lua
UpdateDivider=1

[MeasureDesk]
Measure=WebParser
URL=http://127.0.0.1:4000/api/desk
ForceReload=1
UpdateRate=1
UpdateDivider=8
RegExp=(?siU)status=(.*)\nreply=(.*)\n
FinishAction=[!UpdateMeasure MeasureReply][!UpdateMeter MeterReply][!Redraw]
OnConnectErrorAction=[!SetOption MeterReply Text "offline"][!UpdateMeter MeterReply][!Redraw]

[MeasureReply]
Measure=WebParser
URL=[MeasureDesk]
StringIndex=2
UpdateDivider=8
Substitute="":""

[MeasureRun]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#ScriptDesk#" "x"
State=Hide
OutputType=UTF8
DynamicVariables=1
StartAction=[!SetOption MeterReply Text "…"][!UpdateMeter MeterReply][!Redraw]
FinishAction=[!CommandMeasure MeasureDesk "Update"][!Delay 400][!CommandMeasure MeasureDesk "Update"][!UpdateMeter MeterReply][!Redraw]

[MeasureInput]
Measure=Plugin
Plugin=InputText
X=42
Y=34
W=400
H=22
FontFace=Cascadia Mono
FontSize=13
FontColor=230,230,239
SolidColor=12,12,16
FocusDismiss=0
DefaultValue=
InputLimit=400
Command1=[!SetOption MeasureRun Parameter """-NoProfile -ExecutionPolicy Bypass -File ""#ScriptDesk#"" ""$UserInput$"""][!UpdateMeasure MeasureRun][!CommandMeasure MeasureRun "Run"][!CommandMeasure MeasureInput "Dismiss"]

; --- UI ---
[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,#W#,#H#,8 | Fill Color #Pane# | StrokeWidth 1 | Stroke Color #Line#
LeftMouseUpAction=[!CommandMeasure MeasureInput "ExecuteBatch 1"]

[MeterTopRule]
Meter=Shape
Shape=Rectangle 0,0,#W#,1,0 | Fill Color 90,247,142,220 | StrokeWidth 0

[MeterBrand]
Meter=String
Text=πD
X=14
Y=10
FontFace=#Font#
FontSize=10
FontWeight=700
FontColor=90,247,142,255
AntiAlias=1

[MeterEsc]
Meter=String
Text=esc
X=(#W#-12)
Y=10
StringAlign=Right
FontFace=#Font#
FontSize=9
FontColor=#Faint#
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureInput "Dismiss"][!Hide]

[MeterPrompt]
Meter=String
Text=›
X=14
Y=36
FontFace=#Font#
FontSize=14
FontColor=90,247,142,255
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureInput "ExecuteBatch 1"]

[MeterField]
Meter=Shape
X=34
Y=32
Shape=Rectangle 0,0,412,26,4 | Fill Color #Field# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureInput "ExecuteBatch 1"]

[MeterHint]
Meter=String
Text=ask πD
X=46
Y=36
FontFace=#Font#
FontSize=12
FontColor=#Faint#
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureInput "ExecuteBatch 1"]

[MeterReply]
Meter=String
MeasureName=MeasureReply
X=14
Y=64
W=(#W#-28)
H=14
FontFace=#Font#
FontSize=10
FontColor=#Muted#
AntiAlias=1
ClipString=1
DynamicVariables=1
Text=%1
