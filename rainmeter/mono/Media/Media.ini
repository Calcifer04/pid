; mono | Media  -  metallic companion to mono | Clock
; Steel type, no panel, wave hairlines. Built-in NowPlaying.
; Player= Spotify | AIMP | CAD | WMP | iTunes | Winamp

[Rainmeter]
Update=500
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=mono | Media
Author=basco
Information=Now-playing line in mono steel language. Click title = play/pause.
Version=1.1
License=MIT

[Variables]
FontMain=Cormorant Garamond Light
FontLabel=Cormorant Garamond Medium
Player=Spotify
SteelBright=236,242,247
SteelMid=150,166,180
SteelDim=88,102,116
ShadowColor=0,0,0,200
WaveW=280

[MeasureTitle]
Measure=NowPlaying
PlayerName=#Player#
PlayerType=Title
Substitute="":"— quiet —"

[MeasureArtist]
Measure=NowPlaying
PlayerName=#Player#
PlayerType=Artist
Substitute="":" "

[MeasureState]
Measure=NowPlaying
PlayerName=#Player#
PlayerType=State

[MeasureProgress]
Measure=NowPlaying
PlayerName=#Player#
PlayerType=Progress
MinValue=0
MaxValue=100

[MeasurePosition]
Measure=NowPlaying
PlayerName=#Player#
PlayerType=Position

[MeasureDuration]
Measure=NowPlaying
PlayerName=#Player#
PlayerType=Duration

[MeasureStateText]
Measure=Calc
Formula=[MeasureState]
Substitute="0":"stopped","1":"playing","2":"paused"
DynamicVariables=1

[MeterLabel]
Meter=String
Text=NOW
X=0
Y=0
FontFace=#FontLabel#
FontSize=11
FontColor=#SteelDim#
StringCase=Upper
StringEffect=Shadow
FontEffectColor=#ShadowColor#
AntiAlias=1
CharacterSpacing=4

[MeterTitle]
Meter=String
MeasureName=MeasureTitle
X=0
Y=6R
W=340
H=36
FontFace=#FontMain#
FontSize=28
FontColor=#SteelBright#
StringEffect=Shadow
FontEffectColor=#ShadowColor#
AntiAlias=1
ClipString=1
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureTitle "PlayPause"]
ToolTipText=Play / Pause

[MeterArtist]
Meter=String
MeasureName=MeasureArtist
X=0
Y=2R
W=340
H=22
FontFace=#FontLabel#
FontSize=14
FontColor=#SteelMid#
StringEffect=Shadow
FontEffectColor=#ShadowColor#
AntiAlias=1
ClipString=1
DynamicVariables=1

[MeterWave]
Meter=Shape
X=2
Y=10R
Shape=Rectangle 0,0,#WaveW#,1 | StrokeWidth 0 | Fill LinearGradient Grad
Grad=0 | 236,242,247,0 ; 0.0 | 236,242,247,200 ; 0.35 | 150,166,180,120 ; 0.65 | 236,242,247,0 ; 1.0

[MeterProgTrack]
Meter=Shape
X=2
Y=8R
Shape=Rectangle 0,0,#WaveW#,1 | StrokeWidth 0 | Fill Color 88,102,116,80

[MeterProg]
Meter=Bar
MeasureName=MeasureProgress
X=2
Y=0r
W=#WaveW#
H=1
BarColor=236,242,247,220
SolidColor=0,0,0,1
BarOrientation=Horizontal

[MeterTime]
Meter=String
MeasureName=MeasurePosition
MeasureName2=MeasureDuration
X=0
Y=8R
FontFace=#FontLabel#
FontSize=11
FontColor=#SteelDim#
StringEffect=Shadow
FontEffectColor=#ShadowColor#
AntiAlias=1
Text=%1  /  %2
DynamicVariables=1

[MeterPrev]
Meter=String
X=0
Y=12R
FontFace=#FontLabel#
FontSize=14
FontColor=#SteelMid#
AntiAlias=1
Text=[  prev  ]
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Previous"]

[MeterToggle]
Meter=String
X=8R
Y=0r
FontFace=#FontLabel#
FontSize=14
FontColor=#SteelBright#
AntiAlias=1
Text=[  play  ]
LeftMouseUpAction=[!CommandMeasure MeasureTitle "PlayPause"]

[MeterNext]
Meter=String
X=8R
Y=0r
FontFace=#FontLabel#
FontSize=14
FontColor=#SteelMid#
AntiAlias=1
Text=[  next  ]
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Next"]
