; πD Bar — 26px command strip. Click to type, Enter sends to /api/desk
[Rainmeter]
Update=100
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=πD Bar
Version=3.0.0

[Variables]
H=30
W=400
Ground=3,3,4,235
Line=28,28,38,200
Ink=230,230,239,255
Muted=154,154,171,255
Faint=85,85,102,255
OnGround=3,3,4,255
Font=Cascadia Mono
ScriptDesk=#CURRENTPATH#desk-grok.ps1

[MeasureAccent]
Measure=Script
ScriptFile=color-bar.lua
UpdateDivider=1

[MeasureDesk]
Measure=WebParser
URL=http://127.0.0.1:4000/api/desk
ForceReload=1
UpdateRate=1
UpdateDivider=20
RegExp=(?siU)status=(.*)\nreply=(.*)\n
FinishAction=[!UpdateMeasure MeasureReply][!UpdateMeter MeterReply][!Redraw]
OnConnectErrorAction=[!SetOption MeterReply Text "offline"][!UpdateMeter MeterReply][!Redraw]

[MeasureReply]
Measure=WebParser
URL=[MeasureDesk]
StringIndex=2
UpdateDivider=20
Substitute="":""

[MeasureRun]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#ScriptDesk#" "x"
State=Hide
OutputType=UTF8
DynamicVariables=1
StartAction=[!SetOption MeterReply Text "…"][!SetOption MeterHint Text ""][!UpdateMeter *][!Redraw]
FinishAction=[!SetOption MeterHint Text "ask πD"][!CommandMeasure MeasureDesk "Update"][!Delay 400][!CommandMeasure MeasureDesk "Update"][!UpdateMeter *][!Redraw]

[MeasureInput]
Measure=Plugin
Plugin=InputText
X=42
Y=6
W=200
H=18
FontFace=Cascadia Mono
FontSize=10
FontColor=230,230,239
SolidColor=12,12,16
FocusDismiss=1
DefaultValue=
InputLimit=300
Command1=[!SetOption MeasureRun Parameter """-NoProfile -ExecutionPolicy Bypass -File ""#ScriptDesk#"" ""$UserInput$"""][!UpdateMeasure MeasureRun][!CommandMeasure MeasureRun "Run"]

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,#W#,#H#,0 | Fill Color #Ground# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureInput "ExecuteBatch 1"]

[MeterBrandBg]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,34,#H#,0 | Fill Color 90,247,142,255 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureInput "ExecuteBatch 1"]

[MeterBrand]
Meter=String
Text=πD
X=17
Y=7
StringAlign=Center
FontFace=#Font#
FontSize=10
FontWeight=700
FontColor=#OnGround#
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureInput "ExecuteBatch 1"]

[MeterPrompt]
Meter=String
Text=›
X=42
Y=6
FontFace=#Font#
FontSize=12
FontColor=90,247,142,255
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureInput "ExecuteBatch 1"]

[MeterHint]
Meter=String
Text=ask πD
X=56
Y=7
W=140
H=16
FontFace=#Font#
FontSize=10
FontColor=#Faint#
AntiAlias=1
ClipString=1
LeftMouseUpAction=[!CommandMeasure MeasureInput "ExecuteBatch 1"]

[MeterReply]
Meter=String
MeasureName=MeasureReply
X=200
Y=7
W=190
H=16
FontFace=#Font#
FontSize=9
FontColor=#Muted#
AntiAlias=1
ClipString=1
DynamicVariables=1
Text=%1
